[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native coding-agent CLI (ADR-005). Not an OS sandbox."

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
