[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-harness"
version = "0.1.0"
description = "Minimal agentic harness: loop, tools, plugins. Everything else is a plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agentic-harness = "agentic_harness.cli:main"
ah = "agentic_harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gemini = ["google-genai>=1.0"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["agentic_harness*", "plugins*"]
exclude = ["tests*", "benchmarks*", "examples*", "docs*", "scripts*", "build*", "dist*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
